name: Rust CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --locked --all-targets --features gui
      - name: Tests
        run: cargo test --locked --features gui
      - name: Clippy
        run: cargo clippy --locked --features gui --all-targets -- -D warnings
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Build APK
        run: |
          sdkmanager 'ndk;30.0.16248370' 'platforms;android-35' 'build-tools;35.0.0'
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/30.0.16248370"
          cargo install cargo-apk2 --version 1.5.0 --locked
          cargo apk2 build --lib --features gui --target aarch64-linux-android
