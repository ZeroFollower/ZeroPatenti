name: Aggiorna indice dataset A/B
on:
  push:
    branches: [main]
    paths:
      - 'DB/**.sqlite3'
      - 'scripts/index_datasets.py'
      - '.github/workflows/dataset-index.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dataset-index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Aggiorna le edizioni pubblicate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for _ in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/index_datasets.py
            git add DB/README.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Aggiorna edizione A/B predefinita e listati obsoleti'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
