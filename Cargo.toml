[package]
name = "zeropatenti"
version = "0.1.0"
edition = "2024"
description = "Applicazione offline per quiz patenti italiane"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
fsrs = "=7.0.0"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
