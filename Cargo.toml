[package]
name = "zeropatenti"
version = "0.1.0"
edition = "2024"
description = "Applicazione offline per quiz patenti italiane"
publish = false

[features]
default = []
# La GUI Slint non è ancora implementata: la dipendenza resta opzionale.
gui = ["dep:slint"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4.45", features = ["clock"] }
clap = { version = "4.6.9", features = ["derive"] }
csv = "1.4.0"
fsrs = "7.0.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.19.0", optional = true }
