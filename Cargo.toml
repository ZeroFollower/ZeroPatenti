[package]
name = "zeropatenti"
version = "0.1.0"
edition = "2024"
description = "Applicazione offline per quiz patenti italiane"
publish = false
default-run = "zeropatenti"

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "zeropatenti-gui"
path = "src/bin/desktop.rs"
required-features = ["gui"]

[features]
default = []
gui = ["dep:slint", "dep:jni", "dep:ed25519-dalek", "dep:hex", "dep:tinyfiledialogs"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4.45", features = ["clock"] }
clap = { version = "4.6.9", features = ["derive"] }
csv = "1.4.0"
ed25519-dalek = { version = "2.2", optional = true }
hex = { version = "0.4", optional = true }
fsrs = "7.0.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
ureq = { version = "3", default-features = false, features = ["rustls"] }
tempfile = "3"
sha1 = "0.10"

[target.'cfg(not(target_os = "android"))'.dependencies]
tinyfiledialogs = { version = "3.9", default-features = false, optional = true }
slint = { version = "1.19.0", optional = true, default-features = false, features = ["std", "compat-1-2", "accessibility", "backend-winit", "unstable-winit-030", "renderer-software"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", optional = true }
slint = { version = "1.19.0", optional = true, default-features = false, features = ["std", "compat-1-2", "backend-android-activity-06", "renderer-software"] }

[package.metadata.android]
strip = "split"
java_sources = "android/java"
package = "it.zeropatenti.app"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "ZeroPatenti"

[[package.metadata.android.application.activity]]
name = "it.zeropatenti.app.BankActivity"
exported = true

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "zeropatenti"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]
